<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Feliz San Valentín 💖</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4e8a,#ff9acb);
font-family:Arial, sans-serif;
color:white;
text-align:center;
}

.card{
background:rgba(255,255,255,0.15);
padding:40px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,0.3);
max-width:600px;
backdrop-filter:blur(10px);
}

h1{
font-size:38px;
margin-bottom:20px;
}

.mensaje{
font-size:18px;
line-height:1.6;
margin-top:20px;
}

button{
margin-top:25px;
padding:12px 25px;
border:none;
border-radius:25px;
cursor:pointer;
font-size:18px;
background:white;
color:#ff4e8a;
transition:0.3s;
}

button:hover{
background:#ff4e8a;
color:white;
}

</style>
</head>

<body>

<div class="card">
<h1>Feliz San Valentín 💖</h1>
<p><strong>Aldana ❤️</strong></p>

<button onclick="mostrarMensaje()">Haz click aquí</button>

<div id="mensaje" class="mensaje"></div>
</div>

<script>
function mostrarMensaje(){
document.getElementById("mensaje").innerHTML =
"Te amo mucho, corazón. Gracias por aguantarme siempre y por no aburrirte tan rápido de mí. Aunque siento que últimamente hay muchos problemas y ya no sé exactamente si estás cansada de mí o no; ya me lo contarás al ver este intento de página. No sé programar muy bien, pero lo estoy intentando por esto. Ojalá este 14 de febrero sea muy bonito para los dos y la pasemos juntos, siempre y cuando aceptes, Charlesita. Te amo infinitamente. 💖";
}
</script>

</body>
</html>
